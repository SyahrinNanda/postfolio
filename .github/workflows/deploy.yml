name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify SQLite Database Exists
        run: ls -la sqlite.db
        env:
          DATABASE_URL: "file:./sqlite.db"

      - name: Isolate Public Pages for Static Export
        run: |
          mkdir -p .temp_app
          [ -d "src/app/api" ] && mv src/app/api .temp_app/api || true
          [ -d "src/app/admin" ] && mv src/app/admin .temp_app/admin || true

      - name: Build & Export Static Site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_EXPORT: "true"
          DATABASE_URL: "file:./sqlite.db"

      - name: Restore API & Admin folders
        if: always()
        run: |
          [ -d ".temp_app/api" ] && mv .temp_app/api src/app/api || true
          [ -d ".temp_app/admin" ] && mv .temp_app/admin src/app/admin || true
          rm -rf .temp_app

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4